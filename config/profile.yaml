# Resume tracks.
#
# Four tailored resumes exist, so the tool models four separate targets rather than
# one blended profile. Every posting is scored against all four and keeps the best
# result, which is what lets the alert name the resume to send. A blended profile
# could not do that: averaging the four would rank a React-and-pytest posting on dbt
# terms it does not mention, and a dbt posting on React terms it does not mention,
# scoring both as mediocre instead of recognising each as a strong fit for one track.
#
# Weights are per track. The same technology is worth different amounts depending on
# which resume is being sent: Airflow is the headline on the Data resume and a
# supporting detail on the AI one, so it is weighted 3.0 there and 1.75 here.
#
# `label` is what the Discord alert shows. `resume` is the file to attach, matched
# against the PDFs in the resume directory by prefix.

tracks:

  # ------------------------------------------------------------------ data
  data:
    label: Data
    resume: Data Resume
    skill_target: 22.0
    skills:
      core_data:
        weight: 3.0
        terms: [dbt, Airflow, Spark, PySpark, Kafka, Databricks, Delta Lake,
                Unity Catalog, Redshift]
      warehouse:
        weight: 2.5
        terms: [Snowflake, BigQuery, data warehouse, lakehouse, Iceberg,
                data lake, Athena, Glue, EMR]
      modeling:
        weight: 2.5
        terms: [star schema, dimensional model, data model, data modeling,
                data modelling, incremental, ELT, ETL, entity resolution,
                slowly changing, denormalized, fact table]
      quality:
        weight: 2.0
        terms: [data quality, data governance, freshness, lineage, SLA,
                Great Expectations, Monte Carlo, observability, data contract]
      bi:
        weight: 1.75
        terms: [Power BI, Tableau, Looker, dashboard, semantic layer,
                metrics layer, reporting, Mode, Hex, Superset]
      storage:
        weight: 2.0
        terms: [PostgreSQL, Aurora, pgvector, MySQL, DynamoDB]
      platform:
        weight: 1.5
        terms: [AWS, Azure, GCP, Docker, Kubernetes, CI/CD, Terraform]
      foundational:
        weight: 1.0
        terms: [Python, SQL, Pandas, Java, JavaScript, Git, Linux]
      # Not on the resume, but a posting asking for these is still a strong fit
      # given the core stack.
      adjacent:
        weight: 1.5
        terms: [Fivetran, Airbyte, Dagster, Prefect, dbt Cloud, Trino, Presto,
                Flink, Kinesis, Redpanda, Hightouch, Census, Sigma]

  # -------------------------------------------------------------------- ai
  ai:
    label: AI
    resume: AI Resume
    skill_target: 22.0
    skills:
      llm_core:
        weight: 3.0
        terms: [LLM, large language model, RAG, retrieval augmented, LangChain,
                LlamaIndex, OpenAI API, Anthropic, Claude, MCP,
                Model Context Protocol, tool calling, function calling,
                AI agent, agentic, prompt engineering, fine-tuning]
      evals:
        weight: 2.75
        terms: [eval, evals, evaluation harness, LLM judge, LLM-as-a-judge,
                benchmark, guardrail, hallucination, Langfuse, LangSmith,
                tracing, red team, Weights & Biases]
      vector:
        weight: 2.5
        terms: [pgvector, embedding, embeddings, vector search, vector database,
                semantic search, reranking, cross-encoder, chunking,
                hybrid search, Pinecone, Weaviate, Qdrant, Chroma, FAISS, Milvus]
      ml:
        weight: 2.25
        terms: [PyTorch, Hugging Face, transformers, TensorFlow, scikit-learn,
                KMeans, clustering, classification, OpenCV, computer vision,
                model training, inference, feature engineering, MLOps]
      serving:
        weight: 2.0
        terms: [FastAPI, model serving, vLLM, Triton, GPU, batching, caching,
                p95, latency, throughput, streaming response]
      data_plumbing:
        weight: 1.75
        terms: [Airflow, dbt, Spark, Kafka, Databricks, Redshift, PostgreSQL,
                data pipeline]
      foundational:
        weight: 1.0
        terms: [Python, SQL, Git, Docker, Kubernetes, AWS, Azure, Linux]
      adjacent:
        weight: 1.5
        terms: [Bedrock, Vertex AI, SageMaker, Azure OpenAI, Ollama, DSPy, Ray,
                LoRA, quantization, distillation, Modal, Baseten, Together]

  # ------------------------------------------------------------------- fde
  fde:
    label: FDE
    resume: FDE Resume
    skill_target: 20.0
    skills:
      # The distinguishing group for this track. These are the words that separate a
      # forward-deployed posting from an ordinary engineering one, and they are what
      # the FDE resume leads with: scoping on site, demos to leadership, pilots,
      # parallel runs, sign-off, workshops, runbooks.
      deployment:
        weight: 3.0
        terms: [forward deployed, forward-deployed, deployment strategist,
                deployment engineer, implementation engineer, solutions engineer,
                solutions architect, customer-facing, client-facing, onsite,
                on-site, pilot, rollout, proof of concept, go-live,
                professional services, technical account, embedded with,
                customer deployment, field engineer]
      # Pruned hard after an audit. On 2,378 described postings carrying no
      # deployment-ish title at all, the original terms fired constantly: bare
      # "requirements" on 52%, "cross-functional" 39%, "leadership" 34%,
      # "executive" 30%, bare "training" 29%. At weight 2.75 that gave this track a
      # median 0.412 overlap on postings with nothing forward-deployed about them,
      # so FDE won the resume recommendation on generic corporate prose - including
      # 136 alerts whose titles were not deployment roles in any sense.
      #
      # Bare "training" was the worst of them: it matches "model training", so every
      # ML posting read as stakeholder training. What survives is phrasing that only
      # appears when a human is actually being deployed to a customer.
      stakeholder:
        weight: 2.25
        terms: [stakeholder, workshop, enablement, sign-off, change management,
                trusted advisor, requirements gathering, user training,
                end-user training, customer success, business process,
                executive stakeholder, customer workshop, train the trainer]
      solution_build:
        weight: 2.5
        terms: [LLM, AI agent, tool calling, RAG, LangChain, OpenAI API,
                prototype, demo, bespoke, custom integration, workflow automation,
                data integration]
      integration:
        weight: 2.25
        terms: [REST API, API integration, FastAPI, webhook, SDK, Spring Boot,
                MQTT, ingestion, ETL, dbt, Airflow, Kafka, connector]
      storage:
        weight: 1.75
        terms: [PostgreSQL, Redshift, pgvector, SQL, data warehouse]
      foundational:
        weight: 1.0
        terms: [Python, SQL, JavaScript, Java, Git, Docker, Kubernetes, AWS, Azure]
      adjacent:
        weight: 1.5
        terms: [Palantir, Foundry, Ontology, sales engineer, presales,
                pre-sales, delivery engineer, consultant, systems integration]

  # ------------------------------------------------------------------- swe
  swe:
    label: SWE
    resume: SWE Resume
    skill_target: 22.0
    skills:
      backend:
        weight: 3.0
        terms: [FastAPI, Spring Boot, REST API, API design, backend,
                microservice, microservices, Django, Flask, Express, Node.js,
                gRPC, server-side, distributed system]
      frontend:
        weight: 2.5
        terms: [React, TypeScript, Next.js, frontend, full stack, fullstack,
                full-stack, JavaScript, Redux, component library]
      testing:
        weight: 2.5
        terms: [pytest, JUnit, unit test, integration test, test coverage,
                CI/CD, GitHub Actions, continuous integration, code review,
                pull request, end-to-end test, MockMvc]
      distributed:
        weight: 2.25
        terms: [Kafka, Spark, streaming, message queue, event-driven,
                concurrency, scalability, latency, caching, Redis, idempotent]
      storage:
        weight: 2.0
        terms: [PostgreSQL, Aurora, Redshift, pgvector, SQL, schema design,
                query optimization, database, migration]
      infra:
        weight: 2.0
        terms: [Docker, Kubernetes, AWS, Azure, ECS, Terraform, observability,
                monitoring, feature flag, deployment pipeline]
      foundational:
        weight: 1.0
        terms: [Python, Java, Git, Linux, data structures, algorithms]
      adjacent:
        weight: 1.5
        terms: [GraphQL, RabbitMQ, Celery, SQLAlchemy, Pydantic, Vite,
                Tailwind, Playwright, Jest, OpenAPI, Alembic]
