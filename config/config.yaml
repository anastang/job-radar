# Job Radar configuration.

polling:
  # 0 = poll on every run. Tiering existed purely to save GitHub Actions minutes,
  # which bill per run rather than per board - so polling all ~570 boards costs the
  # same as polling 59. On a public repo, where Actions minutes are unlimited, there
  # is nothing to save and every board gets the full 5-minute cadence. That matters
  # most for the ~350 YC startups, which were previously on a 30-minute delay and are
  # exactly where a tiny applicant pool makes being early count.
  #
  # Set these back to 30 and 15 if you ever move to a private repo on the free tier.
  tier2_every_minutes: 0
  simplify_every_minutes: 0

fetch:
  concurrency: 12
  timeout_seconds: 25
  retries: 3

filters:
  # Never alert on a posting older than this, even if we have only just seen it.
  # Being early is the whole point, and this also contains two burst risks: adding
  # a new company would otherwise dump its entire back catalogue into one run, and
  # the 90-day state prune can make a long-lived posting look new again.
  max_age_days: 30

  # Reject a posting whose stated minimum experience exceeds this. New grad is the
  # emphasis, not the requirement: 1-2 year roles are a fair match and 3 years is a
  # reasonable stretch, so the gate sits at 3 and scoring tapers gently below it
  # rather than burying anything that isn't explicitly new-grad.
  max_years_experience: 3
  # He graduated in April 2026, so internships and co-ops are noise.
  allow_internships: false

  # Count generic software engineering titles when the posting is clearly data/AI
  # centric (needs 3+ distinct data signals in the body). Widens the pool given the
  # Spring Boot / Docker / Kubernetes internship, without letting every web-dev
  # posting through. Note that "Software Engineer" is not itself a USMCA TN
  # profession, whereas data and analytics titles generally map cleanly.
  allow_data_adjacent_swe: true
  # Postings with no parseable location ("Hybrid", "Remote") still alert - several
  # real matches surfaced this way - they just score lower than SF/NYC/Toronto.
  allow_unknown_location: true

  # Cleared/defense employers. Their postings state the clearance requirement in the
  # description, which the auth gate catches - but community-feed entries have no
  # description, so they leak through on title alone. Matched as a substring against
  # the company name, case-insensitively.
  blocked_companies:
    - johns hopkins
    - mantech
    - arcfield
    - chenega
    - bigbear
    - leidos
    - booz allen
    - saic
    - mitre
    - raytheon
    - lockheed
    - northrop
    - general dynamics
    - peraton
    - caci
    - parsons
    - l3harris
    - battelle
    - sandia
    - lincoln laboratory
    - aerospace corporation
    - anduril
    - draper
    - noblis
    - torch technologies
    - kbr
    # Workday tenants are sometimes opaque: "globalhr" is RTX/Raytheon, whose
    # postings would otherwise slip past a name-based blocklist entirely.
    - globalhr

scoring:
  # Out of 100. Below notify_min the posting is recorded but not sent.
  #
  # Set low deliberately: being slightly underqualified does not mean no chance, so
  # the tool errs toward over-notifying and relies on the score to signal which are
  # worth dropping everything for. Raise this if the volume ever gets tiring.
  notify_min: 48
  # At or above this the alert turns orange and @-mentions, so strong matches push to
  # your phone while ordinary ones stay quiet. Set at roughly the 90th percentile of
  # real scoring postings: at 70 about a third of matches pinged, which is too many
  # for the ping to mean anything. Everything below still arrives, just silently.
  priority_min: 75

notify:
  # Left empty on purpose: the Discord user ID is the only PII this repo would
  # otherwise carry, so it lives in the DISCORD_MENTION secret instead and is read
  # from the environment. A bare numeric ID works; the code wraps it in <@...>.
  # To find it: Discord Settings > Advanced > enable Developer Mode, then right-click
  # your own name and choose "Copy User ID".
  mention: ""

state:
  path: state/seen.json
  prune_days: 90
