[project]
name = "jobradar"
version = "0.1.0"
description = "Early-career data/AI job monitor with low-latency Discord alerts"
requires-python = ">=3.11"
dependencies = [
    "httpx[http2]>=0.27",
    "PyYAML>=6.0",
    "pypdf>=4.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
jobradar = "jobradar.run:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "live: hits real network endpoints (deselect with -m 'not live')",
]
